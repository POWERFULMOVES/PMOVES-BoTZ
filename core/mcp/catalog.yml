mcpServers:
  # Agent Skills Library
  skills:
    command: docker
    args:
      - exec
      - -i
      - pmz-skills
      - python
      - skill_server.py
    description: |
      Agent skill management (list, get, search skills).
      Skills are instruction-based guides that teach agents how to perform tasks.
      Available skills: docx, xlsx, pptx, pdf, mcp-builder, skill-creator,
      webapp-testing, frontend-design, canvas-design, and more.

  # Document Processing
  # Authentication: Uses JWT_SECRET for Bearer token validation
  # Header: Authorization: Bearer <jwt_token>
  # Or query param: ?token=<jwt_token>
  # See: features/mcp_bridge/auth.py for validation logic
  docling:
    url: ${DOCLING_URL:-http://localhost:3020/sse}
    transport: sse

  # Code Execution Sandbox
  # Authentication: Uses JWT_SECRET for Bearer token validation
  # Note: E2B_API_KEY is for external E2B API calls, not MCP authentication
  e2b:
    url: ${E2B_URL:-http://localhost:7071/sse}
    transport: sse

  # Vision-Language Guidance
  # Authentication: Uses JWT_SECRET for Bearer token validation
  # Note: OPENAI_API_KEY is for OpenAI API calls, not MCP authentication
  vl-sentinel:
    url: ${VL_SENTINEL_URL:-http://localhost:7072/sse}
    transport: sse

  # Persistent Memory & Reasoning
  cipher-memory:
    command: docker
    args:
      - exec
      - -i
      - pmz-cipher
      - python3
      - memory_shim/app_cipher_memory.py
    env:
      VENICE_API_KEY: ${VENICE_API_KEY}

  # API Testing & Collections
  postman:
    command: docker
    args:
      - exec
      - -i
      - pmz-postman
      - npx
      - "@postman/postman-mcp-server@latest"
      - "--full"
    env:
      POSTMAN_API_KEY: ${POSTMAN_API_KEY}

  # n8n Workflow Automation
  n8n-agent:
    command: docker
    args:
      - exec
      - -i
      - pmz-n8n
      - python
      - app_n8n_agent.py
    env:
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_API_URL: ${N8N_API_URL:-http://n8n:5678/api/v1}
      TENSORZERO_BASE_URL: ${TENSORZERO_BASE_URL:-http://tensorzero-gateway:3030}

  # Hostinger VPS/DNS/Domain Management
  hostinger:
    command: docker
    args:
      - exec
      - -i
      - pmz-hostinger
      - hostinger-api-mcp
    env:
      API_TOKEN: ${HOSTINGER_API_KEY}

  # GitHub API (Org-Wide via PMOVES.AI App)
  # Mints short-lived installation tokens from App credentials,
  # then launches the upstream @modelcontextprotocol/server-github MCP server.
  github:
    command: python
    args:
      - features/github/mint_and_exec.py
    env:
      GH_APP_ID: ${GH_APP_ID}
      GH_APP_SEC: ${GH_APP_SEC}
      GH_APP_INSTALLATION_ID: ${GH_APP_INSTALLATION_ID}
    description: |
      GitHub API via PMOVES.AI App — repos, PRs, issues, code search.
      Org-wide access to all POWERFULMOVES repositories.
      Tools: create_issue, create_pull_request, search_repositories,
      get_file_contents, push_files, list_issues, list_pull_requests, etc.

  # VPN & Remote Desktop Management
  # Headscale VPN (self-hosted Tailscale) + RustDesk remote desktop coordination
  vpn-manager:
    url: ${VPN_MANAGER_URL:-http://localhost:8110/sse}
    transport: sse
    description: |
      VPN and remote desktop management tools.
      Tools: vpn_list_nodes, vpn_create_auth_key, vpn_advertise_route,
             remote_start_session, remote_end_session, remote_list_sessions.
      Integrates: Headscale (VPN), RustDesk (remote desktop), Supabase (logging), NATS (events).
