mcpServers:
  # Document Processing
  # Authentication: Uses SUPABASE_JWT_SECRET for Bearer token validation
  # Header: Authorization: Bearer <jwt_token>
  # Or query param: ?token=<jwt_token>
  # See: features/mcp_bridge/auth.py for validation logic
  docling:
    url: ${DOCLING_URL:-http://localhost:3020/sse}
    transport: sse

  # Code Execution Sandbox
  # Authentication: Uses SUPABASE_JWT_SECRET for Bearer token validation
  # Note: E2B_API_KEY is for external E2B API calls, not MCP authentication
  e2b:
    url: ${E2B_URL:-http://localhost:7071/sse}
    transport: sse

  # Vision-Language Guidance
  # Authentication: Uses SUPABASE_JWT_SECRET for Bearer token validation
  # Note: OPENAI_API_KEY is for OpenAI API calls, not MCP authentication
  vl-sentinel:
    url: ${VL_SENTINEL_URL:-http://localhost:7072/sse}
    transport: sse

  # Persistent Memory & Reasoning
  cipher-memory:
    command: docker
    args:
      - exec
      - -i
      - pmz-cipher
      - python3
      - memory_shim/app_cipher_memory.py
    env:
      VENICE_API_KEY: ${VENICE_API_KEY}

  # API Testing & Collections
  postman:
    command: docker
    args:
      - exec
      - -i
      - pmz-postman
      - npx
      - "@postman/postman-mcp-server@latest"
      - "--full"
    env:
      POSTMAN_API_KEY: ${POSTMAN_API_KEY}

  # n8n Workflow Automation
  n8n-agent:
    command: docker
    args:
      - exec
      - -i
      - pmz-n8n
      - python
      - app_n8n_agent.py
    env:
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_API_URL: ${N8N_API_URL:-http://n8n:5678/api/v1}
      TENSORZERO_BASE_URL: ${TENSORZERO_BASE_URL:-http://tensorzero:3000}

  # Hostinger VPS/DNS/Domain Management
  hostinger:
    command: docker
    args:
      - exec
      - -i
      - pmz-hostinger
      - hostinger-api-mcp
    env:
      API_TOKEN: ${HOSTINGER_API_KEY}
