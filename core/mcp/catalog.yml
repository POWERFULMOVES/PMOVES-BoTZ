mcpServers:
  # Agent Skills Library
  skills:
    command: docker
    args:
      - exec
      - -i
      - pmz-skills
      - python
      - skill_server.py
    description: |
      Agent skill management (list, get, search skills).
      Skills are instruction-based guides that teach agents how to perform tasks.
      Available skills: docx, xlsx, pptx, pdf, mcp-builder, skill-creator,
      webapp-testing, frontend-design, canvas-design, and more.

  # Document Processing
  docling:
    url: http://localhost:3020/sse
    transport: sse

  # Code Execution Sandbox
  e2b:
    url: http://localhost:7071/sse
    transport: sse

  # Vision-Language Guidance
  vl-sentinel:
    url: http://localhost:7072/sse
    transport: sse

  # Persistent Memory & Reasoning
  cipher-memory:
    command: docker
    args:
      - exec
      - -i
      - pmz-cipher
      - python3
      - memory_shim/app_cipher_memory.py
    env:
      VENICE_API_KEY: ${VENICE_API_KEY}

  # API Testing & Collections
  postman:
    command: docker
    args:
      - exec
      - -i
      - pmz-postman
      - npx
      - "@postman/postman-mcp-server@latest"
      - "--full"
    env:
      POSTMAN_API_KEY: ${POSTMAN_API_KEY}

  # n8n Workflow Automation
  n8n-agent:
    command: docker
    args:
      - exec
      - -i
      - pmz-n8n
      - python
      - app_n8n_agent.py
    env:
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_API_URL: ${N8N_API_URL:-http://n8n:5678/api/v1}
      TENSORZERO_BASE_URL: ${TENSORZERO_BASE_URL:-http://tensorzero:3000}

  # Hostinger VPS/DNS/Domain Management
  hostinger:
    command: docker
    args:
      - exec
      - -i
      - pmz-hostinger
      - hostinger-api-mcp
    env:
      API_TOKEN: ${HOSTINGER_API_KEY}
